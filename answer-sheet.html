<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="description" content="สร้างกระดาษคำตอบและตรวจคำตอบช่วงข้อที่เลือก พร้อมคะแนนและเฉลยรายข้อ">
  <title>ตรวจคำตอบ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ตรวจคำตอบ">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/tailwind.js"></script>
</head>
<body class="min-h-screen bg-white text-gray-900">
  <a href="#main" class="skip-link">ข้ามไปที่เนื้อหา</a>

  <header class="appbar">
    <div class="mx-auto flex h-16 w-full max-w-6xl items-center gap-3 px-4 sm:px-6 lg:px-8">
      <a href="index.html" class="flex min-w-0 items-center gap-2.5" aria-label="ค้นหาเฉลยข้อสอบ หน้าแรก">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" class="h-4 w-4">
            <circle cx="10.5" cy="10.5" r="6.5"></circle>
            <path d="m15.5 15.5 4.5 4.5"></path>
          </svg>
        </span>
        <span class="flex min-w-0 flex-col leading-tight">
          <span class="truncate text-[13px] font-semibold sm:text-[15px]">ตรวจคำตอบ</span>
          <span class="hidden text-[11px] text-gray-500 sm:block">ฟิสิกส์ · เคมี · ชีววิทยา · คณิตศาสตร์</span>
        </span>
      </a>

      <nav class="ml-auto flex flex-none items-center gap-4 text-sm font-medium" aria-label="เมนูหลัก">
        <a href="index.html" class="nav-link">ค้นหาเฉลย</a>
        <a href="answer-sheet.html" class="nav-link" aria-current="page">ตรวจคำตอบ</a>
      </nav>
    </div>
  </header>

  <main id="main" class="mx-auto w-full max-w-6xl px-4 pb-16 pt-6 sm:px-6 lg:px-8 lg:pt-10">
    <div class="grid grid-cols-1 gap-5 lg:grid-cols-3 lg:items-start lg:gap-6">

      <!-- ------------------------------ setup ------------------------------ -->
      <section class="card p-5 lg:sticky lg:top-24 lg:p-6" aria-labelledby="setup-title">
        <h1 id="setup-title" class="text-xl font-semibold">ตรวจคำตอบ</h1>
        <p class="mt-1 text-sm text-gray-600">สร้างกระดาษคำตอบสำหรับช่วงข้อที่ต้องการ</p>

        <form id="setup-form" class="mt-5 space-y-4">
          <label for="subject" class="block">
            <span class="step"><span class="step-num" aria-hidden="true">1</span>วิชา</span>
            <select id="subject" class="field"></select>
          </label>

          <label for="chapter" class="block">
            <span class="step"><span class="step-num" aria-hidden="true">2</span>บทที่</span>
            <select id="chapter" class="field"></select>
          </label>

          <div>
            <span class="step"><span class="step-num" aria-hidden="true">3</span>ช่วงข้อ</span>
            <div class="grid grid-cols-2 gap-3">
              <label for="start" class="block">
                <span class="mb-1.5 block text-xs text-gray-500">ข้อเริ่มต้น</span>
                <input id="start" type="number" min="1" step="1" inputmode="numeric" class="field">
              </label>
              <label for="end" class="block">
                <span class="mb-1.5 block text-xs text-gray-500">ข้อสุดท้าย</span>
                <input id="end" type="number" min="1" step="1" inputmode="numeric" class="field">
              </label>
            </div>
            <p id="range-hint" class="mt-2 text-xs text-gray-500"></p>
          </div>

          <button type="submit" class="btn btn-primary w-full">
            สร้างกระดาษคำตอบ
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round" class="h-4 w-4" aria-hidden="true">
              <path d="M12 5v14M5 12h14"></path>
            </svg>
          </button>
        </form>

        <p id="error" class="mt-4 rounded-lg border border-red-300 px-3 py-2.5 text-sm text-red-700" hidden></p>

        <p class="mt-4 text-center text-[11px] leading-relaxed text-gray-500">
          ตัวเลือกจะปรับตามรูปแบบเฉลยของแต่ละบท
        </p>
      </section>

      <!-- ------------------------------ sheet ------------------------------ -->
      <section class="lg:col-span-2" aria-label="กระดาษคำตอบ">

        <div id="sheet-idle" class="card flex min-h-[20rem] flex-col items-center justify-center p-8 text-center lg:min-h-[34rem]">
          <span class="grid h-14 w-14 place-items-center rounded-lg bg-gray-100 text-gray-500">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
                 stroke-linejoin="round" class="h-6 w-6" aria-hidden="true">
              <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h9L20 9.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5Z"></path>
              <path d="M14 4v6h6"></path>
              <path d="m8.5 15 1.8 1.8L14 13"></path>
            </svg>
          </span>
          <p class="mt-4 text-base font-medium">ยังไม่มีกระดาษคำตอบ</p>
          <p class="mt-1 max-w-xs text-sm leading-relaxed text-gray-600">
            เลือกวิชา บทที่ และช่วงข้อ แล้วกด “สร้างกระดาษคำตอบ” เพื่อเริ่มทำแบบฝึกหัด
          </p>
        </div>

        <div id="sheet" hidden>
          <div class="card z-20 mb-4 flex flex-wrap items-center gap-3 p-4 lg:sticky lg:top-16">
            <div class="min-w-0 flex-1 basis-full sm:basis-0">
              <p id="sheet-info" class="text-sm font-medium sm:truncate"></p>
              <p id="score" class="text-sm text-gray-600" hidden></p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button id="check" type="button" class="btn btn-primary btn-sm">ตรวจคำตอบ</button>
              <button id="reveal" type="button" class="btn btn-ghost btn-sm" hidden>แสดงเฉลย</button>
              <button id="reset" type="button" class="btn btn-ghost btn-sm" title="ล้างคำตอบทั้งหมด">ล้าง</button>
            </div>
          </div>

          <div id="rows" class="grid grid-cols-1 gap-3 sm:grid-cols-2"></div>
        </div>

      </section>

    </div>
  </main>

  <button id="to-top" type="button" aria-label="กลับขึ้นด้านบน" hidden
          class="fixed bottom-5 right-5 z-30 rounded-full border border-blue-800 bg-blue-700 px-4 py-3 text-sm font-medium text-white transition-colors hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:ring-offset-2">
    ↑ ขึ้นบนสุด
  </button>

  <script src="data.js"></script>
  <script src="answer-sheet.js"></script>
  <script src="to-top.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
