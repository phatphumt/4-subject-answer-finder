<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ตรวจคำตอบ</title>
  <script src="vendor/tailwind.js"></script>
  <style>
    @font-face {
      font-family: "Anuphan";
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("fonts/anuphan-thai.woff2") format("woff2");
      unicode-range: U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC;
    }
    @font-face {
      font-family: "Anuphan";
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("fonts/anuphan-vietnamese.woff2") format("woff2");
      unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
    }
    @font-face {
      font-family: "Anuphan";
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("fonts/anuphan-latin-ext.woff2") format("woff2");
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: "Anuphan";
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("fonts/anuphan-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    html, body {
      font-family: "Anuphan", sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-white text-gray-900">
  <main class="mx-auto w-full max-w-md p-5 pb-24">
    <div class="text-center">
      <h1 class="text-2xl font-bold leading-tight">ตรวจคำตอบ</h1>
      <p class="mt-2 text-sm text-gray-600">เลือกวิชา บทที่ และช่วงข้อ</p>
      <a href="index.html"
         class="mt-3 inline-block text-sm font-medium text-blue-700 underline underline-offset-4 hover:text-blue-800">
        ค้นหาเฉลย
      </a>
    </div>

    <form id="setup-form" class="mt-8 space-y-5">
      <label class="block">
        <span class="mb-2 block text-sm font-medium">วิชา</span>
        <select id="subject" class="w-full rounded-lg border border-gray-300 bg-white px-3 py-3 text-base focus:border-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-200"></select>
      </label>

      <label class="block">
        <span class="mb-2 block text-sm font-medium">บทที่</span>
        <select id="chapter" class="w-full rounded-lg border border-gray-300 bg-white px-3 py-3 text-base focus:border-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-200"></select>
      </label>

      <div class="grid grid-cols-2 gap-4">
        <label class="block">
          <span class="mb-2 block text-sm font-medium">ข้อเริ่มต้น</span>
          <input id="start" type="number" min="1" step="1" inputmode="numeric"
                 class="w-full rounded-lg border border-gray-300 bg-white px-3 py-3 text-base focus:border-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-200">
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-medium">ข้อสุดท้าย</span>
          <input id="end" type="number" min="1" step="1" inputmode="numeric"
                 class="w-full rounded-lg border border-gray-300 bg-white px-3 py-3 text-base focus:border-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-200">
        </label>
      </div>

      <button type="submit"
              class="w-full rounded-lg bg-blue-700 px-4 py-3 text-base font-medium text-white transition-colors hover:bg-blue-800 active:bg-blue-900 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:ring-offset-2">
        สร้างกระดาษคำตอบ
      </button>
    </form>

    <p id="error" class="mt-5 hidden rounded-lg border border-red-300 p-4 text-center text-sm text-red-700"></p>

    <section id="sheet" class="mt-8 hidden">
      <div class="text-center">
        <p id="sheet-info" class="text-sm leading-relaxed text-gray-600"></p>
        <p id="score" class="mt-3 hidden text-xl font-bold"></p>
        <div class="mt-4 flex justify-center gap-3">
          <button id="check" type="button"
                  class="rounded-lg bg-blue-700 px-4 py-2.5 text-sm font-medium text-white transition-colors hover:bg-blue-800 active:bg-blue-900 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:ring-offset-2">
            ตรวจคำตอบ
          </button>
          <button id="reveal" type="button"
                  class="hidden rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm font-medium transition-colors hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-200">
            แสดงเฉลย
          </button>
        </div>
      </div>

      <div id="rows" class="mt-6 space-y-4"></div>
    </section>
  </main>

  <button id="to-top" type="button" aria-label="กลับขึ้นด้านบน"
          class="fixed bottom-5 right-5 hidden rounded-full border border-blue-800 bg-blue-700 px-4 py-3 text-sm font-medium text-white transition-colors hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:ring-offset-2">
    ↑ ขึ้นบนสุด
  </button>

  <script src="data.js"></script>
  <script src="answer-sheet.js"></script>
  <script src="to-top.js"></script>
</body>
</html>
